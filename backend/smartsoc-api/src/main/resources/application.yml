# ============================================================
# SmartSOC Backend - configuration commune (tous profils)
# Les secrets viennent EXCLUSIVEMENT de variables d'environnement.
# ============================================================
spring:
  application:
    name: smartsoc-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartsoc}
    username: ${POSTGRES_USER:smartsoc}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    # Le schema est la propriete exclusive de Flyway : Hibernate se
    # contente de VALIDER que le mapping correspond.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          # Timeouts du classifieur TP/FP (ADR-008) : jamais plus de 5 s
          # d'attente — au-delà, dégradation gracieuse (alerte sans score).
          ai-classifier:
            connect-timeout: 2000
            read-timeout: 5000

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    # Ne jamais fuiter la stacktrace : la gestion d'erreurs RFC 9457
    # fournira des reponses normalisees.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

smartsoc:
  security:
    jwt:
      # Secret HMAC >= 256 bits, exclusivement via l'environnement.
      # Le demarrage echoue si absent ou trop court (voir JwtConfig) ;
      # seul le profil dev fournit un defaut.
      secret: ${JWT_SECRET:}
      issuer: smartsoc
      access-token-ttl: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}m
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}d
    bootstrap-admin:
      username: ${SMARTSOC_ADMIN_USERNAME:admin}
      email: ${SMARTSOC_ADMIN_EMAIL:admin@smartsoc.local}
      password: ${SMARTSOC_ADMIN_PASSWORD:}
    ingest:
      # Cle d'API des webhooks d'ingestion (outils SOC).
      # Vide = ingestion desactivee (la plateforme fonctionne sans SOC).
      api-key: ${SMARTSOC_INGEST_API_KEY:}
  ai:
    # simulation (defaut) = stubs embarques, plateforme demontrable seule ;
    # live = clients Feign vers les vrais services IA (ADR-008).
    # Brancher les vraies IA = changer ces variables, zero ligne de code.
    mode: ${SMARTSOC_AI_MODE:simulation}
    classifier:
      url: ${SMARTSOC_AI_CLASSIFIER_URL:http://localhost:8000}
      api-key: ${SMARTSOC_AI_CLASSIFIER_API_KEY:}

resilience4j:
  circuitbreaker:
    instances:
      # Classifieur TP/FP : apres 50% d'echecs sur 10 appels, le circuit
      # s'ouvre 30 s — les alertes restent traitables sans score (ADR-008).
      aiClassifier:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

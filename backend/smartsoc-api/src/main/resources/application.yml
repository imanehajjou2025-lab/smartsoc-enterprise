# ============================================================
# SmartSOC Backend - configuration commune (tous profils)
# Les secrets viennent EXCLUSIVEMENT de variables d'environnement.
# ============================================================
spring:
  application:
    name: smartsoc-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartsoc}
    username: ${POSTGRES_USER:smartsoc}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    # Le schema est la propriete exclusive de Flyway : Hibernate se
    # contente de VALIDER que le mapping correspond.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  # Vide par defaut : le bean JavaMailSender se cree quand meme (host="")
  # mais ne se connecte qu'au moment d'un envoi reel — inoffensif tant que
  # smartsoc.notifications.mode reste "simulation" (LiveReportNotifier,
  # seul a l'utiliser, n'est alors meme pas instancie).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    openfeign:
      client:
        config:
          # Timeouts du classifieur TP/FP (ADR-008) : jamais plus de 5 s
          # d'attente — au-delà, dégradation gracieuse (alerte sans score).
          ai-classifier:
            connect-timeout: 2000
            read-timeout: 5000
          # Assistant conversationnel (ADR-008, révisé) : jusqu'à 120 s
          # (génération LLM — un modèle plus lourd type qwen2.5:7b en CPU
          # peut prendre 60-90s+ sur une réponse détaillée) — au-delà, la
          # console affiche "assistant indisponible".
          ai-assistant:
            connect-timeout: 3000
            read-timeout: 120000

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    # Ne jamais fuiter la stacktrace : la gestion d'erreurs RFC 9457
    # fournira des reponses normalisees.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # spring-boot-starter-mail enregistre un indicateur qui tente une
    # connexion SMTP réelle : sans hôte configuré (mode notifications
    # "simulation", le défaut), il reste DOWN en permanence et ferait
    # échouer /actuator/health agrégé — donc le HEALTHCHECK Docker — alors
    # que la plateforme fonctionne normalement (ADR-013, même esprit que
    # le classifieur IA qui reste disponible sans service IA réel).
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

smartsoc:
  security:
    jwt:
      # Secret HMAC >= 256 bits, exclusivement via l'environnement.
      # Le demarrage echoue si absent ou trop court (voir JwtConfig) ;
      # seul le profil dev fournit un defaut.
      secret: ${JWT_SECRET:}
      issuer: smartsoc
      access-token-ttl: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}m
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}d
    bootstrap-admin:
      username: ${SMARTSOC_ADMIN_USERNAME:admin}
      email: ${SMARTSOC_ADMIN_EMAIL:admin@smartsoc.local}
      password: ${SMARTSOC_ADMIN_PASSWORD:}
    ingest:
      # Cle d'API des webhooks d'ingestion (outils SOC).
      # Vide = ingestion desactivee (la plateforme fonctionne sans SOC).
      api-key: ${SMARTSOC_INGEST_API_KEY:}
    ai-tools:
      # Cle d'API de LECTURE dediee au service d'assistant IA externe (ses
      # outils lisent des donnees existantes, GET uniquement, ADR-008).
      # Vide = les outils IA ne peuvent pas s'authentifier.
      api-key: ${SMARTSOC_AI_TOOLS_API_KEY:}
  ai:
    # simulation (defaut) = stubs embarques, plateforme demontrable seule ;
    # live = clients Feign vers les vrais services IA (ADR-008).
    # Brancher les vraies IA = changer ces variables, zero ligne de code.
    mode: ${SMARTSOC_AI_MODE:simulation}
    classifier:
      url: ${SMARTSOC_AI_CLASSIFIER_URL:http://localhost:8000}
      api-key: ${SMARTSOC_AI_CLASSIFIER_API_KEY:}
    assistant:
      url: ${SMARTSOC_AI_ASSISTANT_URL:http://localhost:8001}
      api-key: ${SMARTSOC_AI_ASSISTANT_API_KEY:}
  notifications:
    # simulation (defaut) = journalise, plateforme demontrable sans SMTP ;
    # live = e-mail reel via spring.mail.* (ADR-005). Meme doctrine que ai.mode.
    mode: ${SMARTSOC_NOTIFICATIONS_MODE:simulation}
    from-address: ${SMARTSOC_NOTIFICATIONS_FROM:smartsoc@localhost}
  connectors:
    # simulation (defaut) = stub embarque ; live = vraie API Wazuh (Feign) ;
    # disabled = coupe franc, aucune tentative. ADR-014, amendement v1.1.
    wazuh:
      mode: ${SMARTSOC_CONNECTORS_WAZUH_MODE:simulation}
      url: ${SMARTSOC_CONNECTORS_WAZUH_URL:https://localhost:55000}
      # Compte API dedie en LECTURE SEULE (ADR-015) -- jamais le compte admin.
      username: ${SMARTSOC_CONNECTORS_WAZUH_USERNAME:}
      password: ${SMARTSOC_CONNECTORS_WAZUH_PASSWORD:}
      sync-initial-delay-ms: ${SMARTSOC_CONNECTORS_WAZUH_SYNC_INITIAL_DELAY_MS:15000}
      # ~5 min : meme doctrine que le reste du projet, une valeur mesuree
      # en reel plutot qu'estimee (voir ADR-014 §1.2, a affiner en usage).
      sync-interval-ms: ${SMARTSOC_CONNECTORS_WAZUH_SYNC_INTERVAL_MS:300000}
      # Sous-contexte actions (ADR-014 phase 5, EFFET REEL) : identifiants
      # et mode INDEPENDANTS de la lecture ci-dessus -- compte dedie
      # smartsoc-actuator, jamais smartsoc-reader elargi.
      actions:
        mode: ${SMARTSOC_CONNECTORS_WAZUH_ACTIONS_MODE:simulation}
        username: ${SMARTSOC_CONNECTORS_WAZUH_ACTIONS_USERNAME:}
        password: ${SMARTSOC_CONNECTORS_WAZUH_ACTIONS_PASSWORD:}
    # Indexer Wazuh (OpenSearch) -- source confirmee en reel des
    # vulnerabilites (ADR-014 §1.3, 2026-08-09). Basic Auth a chaque
    # requete, pas de jeton (contrairement a wazuh ci-dessus).
    open-search:
      mode: ${SMARTSOC_CONNECTORS_OPENSEARCH_MODE:simulation}
      url: ${SMARTSOC_CONNECTORS_OPENSEARCH_URL:https://localhost:9200}
      username: ${SMARTSOC_CONNECTORS_OPENSEARCH_USERNAME:}
      password: ${SMARTSOC_CONNECTORS_OPENSEARCH_PASSWORD:}
      vulnerability-index-pattern: ${SMARTSOC_CONNECTORS_OPENSEARCH_VULN_INDEX_PATTERN:wazuh-states-vulnerabilities-*}
      # A LA DEMANDE d'un analyste (Threat Hunting, phase 4) : aucun
      # planificateur, contrairement au flux vulnerabilites ci-dessus.
      alert-index-pattern: ${SMARTSOC_CONNECTORS_OPENSEARCH_ALERT_INDEX_PATTERN:wazuh-alerts-*}
      sync-initial-delay-ms: ${SMARTSOC_CONNECTORS_OPENSEARCH_SYNC_INITIAL_DELAY_MS:30000}
      # ~10 min : cycle moins frequent que les agents, un scan de
      # vulnerabilites evolue plus lentement qu'un etat d'agent.
      sync-interval-ms: ${SMARTSOC_CONNECTORS_OPENSEARCH_SYNC_INTERVAL_MS:600000}
    # API REST MISP -- clef statique en en-tete Authorization (verifie en
    # reel le 2026-08-09), aucun jeton a rafraichir. Phase 2, ADR-014.
    misp:
      mode: ${SMARTSOC_CONNECTORS_MISP_MODE:simulation}
      url: ${SMARTSOC_CONNECTORS_MISP_URL:https://localhost}
      api-key: ${SMARTSOC_CONNECTORS_MISP_API_KEY:}
      sync-initial-delay-ms: ${SMARTSOC_CONNECTORS_MISP_SYNC_INITIAL_DELAY_MS:45000}
      # ~15 min : un flux CTI evolue plus lentement qu'un etat d'agent ou
      # un scan de vulnerabilites -- pas besoin d'un cycle plus serre.
      sync-interval-ms: ${SMARTSOC_CONNECTORS_MISP_SYNC_INTERVAL_MS:900000}
    # API REST publique VirusTotal -- clef statique en en-tete x-apikey.
    # A LA DEMANDE d'un analyste uniquement (jamais sur le flux, R4) :
    # aucun planificateur, contrairement aux autres connecteurs. Phase 3, ADR-014.
    virustotal:
      mode: ${SMARTSOC_CONNECTORS_VIRUSTOTAL_MODE:simulation}
      url: ${SMARTSOC_CONNECTORS_VIRUSTOTAL_URL:https://www.virustotal.com/api/v3}
      api-key: ${SMARTSOC_CONNECTORS_VIRUSTOTAL_API_KEY:}
      # Duree de fraicheur du cache -- protege le quota strict (4 req/min,
      # 500/jour en offre gratuite), pas une simple optimisation de latence.
      cache-ttl-hours: ${SMARTSOC_CONNECTORS_VIRUSTOTAL_CACHE_TTL_HOURS:24}
    # Declenchement de workflow Shuffle + reconciliation (ADR-014 phase 5,
    # EFFET REEL). Le webhook de declenchement porte son propre secret
    # (aucune cle requise) ; la cle d'API globale ne sert qu'a la
    # consultation de statut -- verifie en reel le 2026-08-10.
    shuffle:
      mode: ${SMARTSOC_CONNECTORS_SHUFFLE_MODE:simulation}
      url: ${SMARTSOC_CONNECTORS_SHUFFLE_URL:https://localhost:3443}
      api-key: ${SMARTSOC_CONNECTORS_SHUFFLE_API_KEY:}

resilience4j:
  circuitbreaker:
    instances:
      # Classifieur TP/FP : apres 50% d'echecs sur 10 appels, le circuit
      # s'ouvre 30 s — les alertes restent traitables sans score (ADR-008).
      aiClassifier:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Assistant conversationnel : meme doctrine que le classifieur (ADR-008).
      socAssistant:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Inventaire d'agents Wazuh : meme doctrine, ADR-014.
      wazuhAgentInventory:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Sante du gestionnaire Wazuh : meme doctrine, ADR-014.
      wazuhManagerStats:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Inventaire systeme (syscollector) par agent : meme doctrine, ADR-014.
      wazuhSystemInventory:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Flux de vulnerabilites (Indexer OpenSearch) : meme doctrine, ADR-014 §1.3.
      openSearchVulnerabilityFeed:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Threat Hunting live (Indexer OpenSearch) : meme doctrine, ADR-014 phase 4.
      openSearchHuntExecution:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Controle d'agents Wazuh (EFFET REEL, ADR-014 phase 5) : protege
      # contre un Wazuh degrade qui ferait echouer action apres action --
      # n'implique AUCUN retry automatique (SocActionService, aucune
      # commande rejouee), seulement un coupe-circuit d'echec rapide.
      wazuhAgentControl:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Flux CTI MISP : meme doctrine, ADR-014 phase 2.
      mispThreatIntel:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Reputation VirusTotal : meme doctrine, ADR-014 phase 3.
      virusTotalReputation:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Declenchement de workflow Shuffle (EFFET REEL, ADR-014 phase 5) :
      # meme doctrine que wazuhAgentControl, aucun retry automatique.
      shuffleWorkflowTrigger:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Reconciliation Shuffle (lecture, ADR-014 phase 5) : instance
      # distincte du declenchement -- un Shuffle degrade pour la lecture
      # ne doit pas ouvrir le circuit du declenchement, et inversement.
      shuffleWorkflowStatus:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  ratelimiter:
    instances:
      # Quota VirusTotal reel (offre gratuite) : 4 requetes/minute. Timeout
      # d'attente nul -- un appel qui ne peut pas passer immediatement
      # echoue net (degradation gracieuse cote service, jamais un blocage
      # de la requete HTTP de l'analyste).
      virusTotalReputation:
        limit-for-period: 4
        limit-refresh-period: 60s
        timeout-duration: 0s

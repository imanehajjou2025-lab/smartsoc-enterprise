# ============================================================
# SmartSOC Backend - configuration commune (tous profils)
# Les secrets viennent EXCLUSIVEMENT de variables d'environnement.
# ============================================================
spring:
  application:
    name: smartsoc-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smartsoc}
    username: ${POSTGRES_USER:smartsoc}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    # Le schema est la propriete exclusive de Flyway : Hibernate se
    # contente de VALIDER que le mapping correspond.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  # Vide par defaut : le bean JavaMailSender se cree quand meme (host="")
  # mais ne se connecte qu'au moment d'un envoi reel — inoffensif tant que
  # smartsoc.notifications.mode reste "simulation" (LiveReportNotifier,
  # seul a l'utiliser, n'est alors meme pas instancie).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    openfeign:
      client:
        config:
          # Timeouts du classifieur TP/FP (ADR-008) : jamais plus de 5 s
          # d'attente — au-delà, dégradation gracieuse (alerte sans score).
          ai-classifier:
            connect-timeout: 2000
            read-timeout: 5000
          # Assistant conversationnel (ADR-008, révisé) : jusqu'à 120 s
          # (génération LLM — un modèle plus lourd type qwen2.5:7b en CPU
          # peut prendre 60-90s+ sur une réponse détaillée) — au-delà, la
          # console affiche "assistant indisponible".
          ai-assistant:
            connect-timeout: 3000
            read-timeout: 120000

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    # Ne jamais fuiter la stacktrace : la gestion d'erreurs RFC 9457
    # fournira des reponses normalisees.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # spring-boot-starter-mail enregistre un indicateur qui tente une
    # connexion SMTP réelle : sans hôte configuré (mode notifications
    # "simulation", le défaut), il reste DOWN en permanence et ferait
    # échouer /actuator/health agrégé — donc le HEALTHCHECK Docker — alors
    # que la plateforme fonctionne normalement (ADR-013, même esprit que
    # le classifieur IA qui reste disponible sans service IA réel).
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

smartsoc:
  security:
    jwt:
      # Secret HMAC >= 256 bits, exclusivement via l'environnement.
      # Le demarrage echoue si absent ou trop court (voir JwtConfig) ;
      # seul le profil dev fournit un defaut.
      secret: ${JWT_SECRET:}
      issuer: smartsoc
      access-token-ttl: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}m
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}d
    bootstrap-admin:
      username: ${SMARTSOC_ADMIN_USERNAME:admin}
      email: ${SMARTSOC_ADMIN_EMAIL:admin@smartsoc.local}
      password: ${SMARTSOC_ADMIN_PASSWORD:}
    ingest:
      # Cle d'API des webhooks d'ingestion (outils SOC).
      # Vide = ingestion desactivee (la plateforme fonctionne sans SOC).
      api-key: ${SMARTSOC_INGEST_API_KEY:}
    ai-tools:
      # Cle d'API de LECTURE dediee au service d'assistant IA externe (ses
      # outils lisent des donnees existantes, GET uniquement, ADR-008).
      # Vide = les outils IA ne peuvent pas s'authentifier.
      api-key: ${SMARTSOC_AI_TOOLS_API_KEY:}
  ai:
    # simulation (defaut) = stubs embarques, plateforme demontrable seule ;
    # live = clients Feign vers les vrais services IA (ADR-008).
    # Brancher les vraies IA = changer ces variables, zero ligne de code.
    mode: ${SMARTSOC_AI_MODE:simulation}
    classifier:
      url: ${SMARTSOC_AI_CLASSIFIER_URL:http://localhost:8000}
      api-key: ${SMARTSOC_AI_CLASSIFIER_API_KEY:}
    assistant:
      url: ${SMARTSOC_AI_ASSISTANT_URL:http://localhost:8001}
      api-key: ${SMARTSOC_AI_ASSISTANT_API_KEY:}
  notifications:
    # simulation (defaut) = journalise, plateforme demontrable sans SMTP ;
    # live = e-mail reel via spring.mail.* (ADR-005). Meme doctrine que ai.mode.
    mode: ${SMARTSOC_NOTIFICATIONS_MODE:simulation}
    from-address: ${SMARTSOC_NOTIFICATIONS_FROM:smartsoc@localhost}

resilience4j:
  circuitbreaker:
    instances:
      # Classifieur TP/FP : apres 50% d'echecs sur 10 appels, le circuit
      # s'ouvre 30 s — les alertes restent traitables sans score (ADR-008).
      aiClassifier:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      # Assistant conversationnel : meme doctrine que le classifieur (ADR-008).
      socAssistant:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

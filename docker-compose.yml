# ============================================================
# SmartSOC Enterprise - environnement Docker Compose
# Contient UNIQUEMENT les services de la plateforme (ADR-005) :
# jamais les outils SOC ni les services IA, qui sont externes
# et integres par configuration.
#
# Usage : cp .env.example .env  (puis renseigner les valeurs)
#         docker compose up -d --build
# ============================================================
name: smartsoc

services:
  postgres:
    image: postgres:18-alpine
    container_name: smartsoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartsoc}
      POSTGRES_USER: ${POSTGRES_USER:-smartsoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartsoc} -d ${POSTGRES_DB:-smartsoc}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartsoc-net

  # Service unique de la plateforme : Spring Boot sert l'API ET l'UI React
  # (sans Nginx). Cloudflare Tunnel exposera ce seul service (ADR-007).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smartsoc/backend:local
    container_name: smartsoc-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-smartsoc}
      POSTGRES_USER: ${POSTGRES_USER:-smartsoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (at least 32 characters)}
      SMARTSOC_ADMIN_USERNAME: ${SMARTSOC_ADMIN_USERNAME:-admin}
      SMARTSOC_ADMIN_EMAIL: ${SMARTSOC_ADMIN_EMAIL:-admin@smartsoc.local}
      SMARTSOC_ADMIN_PASSWORD: ${SMARTSOC_ADMIN_PASSWORD:?SMARTSOC_ADMIN_PASSWORD must be set in .env}
      # Optionnelle : vide = ingestion desactivee (plateforme autonome, ADR-005)
      SMARTSOC_INGEST_API_KEY: ${SMARTSOC_INGEST_API_KEY:-}
      # Optionnelle : cle de lecture dediee aux outils de l'assistant IA (ADR-008)
      SMARTSOC_AI_TOOLS_API_KEY: ${SMARTSOC_AI_TOOLS_API_KEY:-}
      # Integration IA (ADR-008) : simulation par defaut. Brancher les vrais
      # services IA = passer en live + renseigner URL et cle, rien d'autre.
      SMARTSOC_AI_MODE: ${SMARTSOC_AI_MODE:-simulation}
      SMARTSOC_AI_CLASSIFIER_URL: ${SMARTSOC_AI_CLASSIFIER_URL:-http://localhost:8000}
      SMARTSOC_AI_CLASSIFIER_API_KEY: ${SMARTSOC_AI_CLASSIFIER_API_KEY:-}
      SMARTSOC_AI_ASSISTANT_URL: ${SMARTSOC_AI_ASSISTANT_URL:-http://localhost:8001}
      SMARTSOC_AI_ASSISTANT_API_KEY: ${SMARTSOC_AI_ASSISTANT_API_KEY:-}
      # Connecteurs SOC (ADR-014) : simulation par defaut, vide si non
      # renseigne dans .env -- passer un mode a "live" sans ses identifiants
      # associes echoue au demarrage du cycle, jamais silencieusement.
      SMARTSOC_CONNECTORS_WAZUH_MODE: ${SMARTSOC_CONNECTORS_WAZUH_MODE:-simulation}
      SMARTSOC_CONNECTORS_WAZUH_URL: ${SMARTSOC_CONNECTORS_WAZUH_URL:-https://localhost:55000}
      SMARTSOC_CONNECTORS_WAZUH_USERNAME: ${SMARTSOC_CONNECTORS_WAZUH_USERNAME:-}
      SMARTSOC_CONNECTORS_WAZUH_PASSWORD: ${SMARTSOC_CONNECTORS_WAZUH_PASSWORD:-}
      SMARTSOC_CONNECTORS_OPENSEARCH_MODE: ${SMARTSOC_CONNECTORS_OPENSEARCH_MODE:-simulation}
      SMARTSOC_CONNECTORS_OPENSEARCH_URL: ${SMARTSOC_CONNECTORS_OPENSEARCH_URL:-https://localhost:9200}
      SMARTSOC_CONNECTORS_OPENSEARCH_USERNAME: ${SMARTSOC_CONNECTORS_OPENSEARCH_USERNAME:-}
      SMARTSOC_CONNECTORS_OPENSEARCH_PASSWORD: ${SMARTSOC_CONNECTORS_OPENSEARCH_PASSWORD:-}
      SMARTSOC_CONNECTORS_MISP_MODE: ${SMARTSOC_CONNECTORS_MISP_MODE:-simulation}
      SMARTSOC_CONNECTORS_MISP_URL: ${SMARTSOC_CONNECTORS_MISP_URL:-https://localhost}
      SMARTSOC_CONNECTORS_MISP_API_KEY: ${SMARTSOC_CONNECTORS_MISP_API_KEY:-}
      SMARTSOC_CONNECTORS_VIRUSTOTAL_MODE: ${SMARTSOC_CONNECTORS_VIRUSTOTAL_MODE:-simulation}
      SMARTSOC_CONNECTORS_VIRUSTOTAL_API_KEY: ${SMARTSOC_CONNECTORS_VIRUSTOTAL_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartsoc-net

volumes:
  postgres-data:
    name: smartsoc-postgres-data

networks:
  smartsoc-net:
    name: smartsoc-net
    driver: bridge

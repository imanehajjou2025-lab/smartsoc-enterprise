# Configuration nginx du frontend SmartSOC.
# Reproduit exactement le contrat du proxy Vite en dev : le navigateur ne
# parle qu'a nginx, /api est relaye vers le backend (nom de service compose).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En-tetes de securite
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API relayee vers le backend (reseau Docker interne)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket STOMP (temps reel) : upgrade de connexion requis
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Connexions longues : pas de timeout de lecture agressif
        proxy_read_timeout 3600s;
    }

    # Assets fingerprints : cache long, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

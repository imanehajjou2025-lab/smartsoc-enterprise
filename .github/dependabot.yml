# Dependabot — surveillance automatique des dépendances.
# Les écosystèmes npm (frontend/) et pip (ai-service/) seront ajoutés
# dans la PR qui crée leur manifeste respectif : les configurer sur
# des répertoires vides provoque des runs en erreur.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5

  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "area:backend"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
    groups:
      # Les dependances Spring évoluent ensemble : une seule PR groupée
      spring:
        patterns:
          - "org.springframework*"
    ignore:
      # Le projet est volontairement sur Spring Boot 3 (cahier des charges,
      # ADR-002) : ne jamais proposer les majeures Spring / springdoc
      # (springdoc 3.x cible Spring Boot 4).
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
